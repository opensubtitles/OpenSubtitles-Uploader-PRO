name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 - Linux Intel/AMD
          - platform: 'ubuntu-22.04'
            args: ''
            target: 'x86_64-unknown-linux-gnu'
            arch: 'x64'
            os: 'linux'
          
          # macOS Universal Binary (Intel + Apple Silicon) - using 14 for compatibility
          - platform: 'macos-14'
            args: ''
            target: 'universal-apple-darwin'
            arch: 'universal'
            os: 'macos'
          
          # Windows Intel/AMD builds - using explicit version for stability
          - platform: 'windows-2022'
            args: ''
            target: 'x86_64-pc-windows-msvc'
            arch: 'x64'
            os: 'windows'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45  # Reduced timeout to prevent resource exhaustion
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # Install Tauri 2.0 dependencies (webkit2gtk-4.1 - confirmed available on Ubuntu 22.04)
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - name: Install dependencies (macOS only)
        if: matrix.os == 'macos'
        run: |
          # No additional dependencies needed for macOS - Tauri uses system frameworks

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'x86_64-apple-darwin,aarch64-apple-darwin' || matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate embedded changelog
        run: |
          echo "📝 Generating embedded changelog for build..."
          node scripts/generate-changelog.js
          echo "✅ Changelog generated successfully"

      - name: Verify Tauri CLI and basic setup
        shell: bash
        run: |
          echo "🔍 Verifying Tauri CLI installation..."
          npx tauri --version || echo "❌ Tauri CLI not accessible via npx"
          
          echo "📦 Checking package.json scripts:"
          grep -A3 "tauri" package.json || echo "No tauri scripts found"
          
          echo "🔧 Checking Tauri config:"
          if [ -f "src-tauri/tauri.conf.json" ]; then
            echo "✅ Tauri config exists"
            head -5 src-tauri/tauri.conf.json
          else
            echo "❌ Tauri config missing"
            exit 1
          fi
          
          echo "📁 Project structure:"
          ls -la src-tauri/ || echo "src-tauri directory missing"
          
          echo "🦀 Rust toolchain info:"
          rustc --version
          cargo --version

      - name: Build the app (Universal Binary)
        if: matrix.target == 'universal-apple-darwin'
        env:
          VITE_OPENSUBTITLES_API_KEY: ${{ secrets.VITE_OPENSUBTITLES_API_KEY }}
          NODE_ENV: production
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "🍎 Building macOS with basic debugging..."
          echo "Debug - Environment info:"
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          echo "Rust: $(rustc --version)"
          echo "Cargo: $(cargo --version)"
          echo "Architecture: $(uname -m)"
          echo "Available disk space: $(df -h . | tail -1)"
          
          echo "🔧 Trying basic macOS build..."
          # "app" must be listed alongside "dmg". createUpdaterArtifacts only emits
          # the .app.tar.gz and .app.tar.gz.sig that the updater needs when the app
          # bundle is built, and passing --bundles overrides "targets": "all" from
          # tauri.conf.json. With dmg alone the manifest falls back to pointing
          # macOS users at a .dmg, which the updater cannot install, with an empty
          # signature — which is how macOS auto-update was broken through v1.8.23.
          if npm run tauri build -- --bundles app,dmg --target universal-apple-darwin --verbose 2>&1 | tee macos-build.log; then
            echo "✅ macOS build successful"
            echo "🔍 Generated files:"
            find src-tauri/target -name "*.dmg" -o -name "*.app" | head -10
            
            # Move for consistency with upload logic
            mkdir -p src-tauri/target/universal-apple-darwin/release/bundle
            if [ -d "src-tauri/target/release/bundle" ]; then
              cp -R src-tauri/target/release/bundle/* src-tauri/target/universal-apple-darwin/release/bundle/
              echo "✅ Artifacts moved to universal directory"
            fi
          else
            echo "❌ macOS build failed, showing logs:"
            tail -100 macos-build.log
            echo "=== Checking for specific error patterns ==="
            grep -i "error\|failed\|panic" macos-build.log | tail -10 || echo "No obvious errors found"
            exit 1
          fi

      - name: Get version for release
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v$(node -p "require('./package.json').version")"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Release version: $VERSION"

      - name: Ensure release exists
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          echo "🔍 Checking if release $VERSION exists..."
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "✅ Release $VERSION already exists"
          else
            echo "📦 Creating release $VERSION..."

            # Extract commit message for release notes (remove emoji prefix and "RELEASE:" text)
            COMMIT_MSG=$(git log -1 --format='%B' | sed 's/^🚀 RELEASE: //' | sed "s/^Version $VERSION - //")

            # If commit message is empty or generic, use a default message
            if [ -z "$COMMIT_MSG" ] || echo "$COMMIT_MSG" | grep -qi "^Build"; then
              COMMIT_MSG="New release with improvements and bug fixes. See commit history for detailed changes."
            fi

            # Create release with commit message as notes
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes "$COMMIT_MSG"
            echo "✅ Release $VERSION created successfully"
          fi

      - name: Upload macOS Universal artifacts to release
        if: matrix.target == 'universal-apple-darwin' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📦 Uploading macOS artifacts to release..."
          
          echo "🔍 Debug: Searching for macOS artifacts..."
          find src-tauri -name "*.dmg" | head -5 || echo "No DMG files found"
          find src-tauri -name "*.app" | head -5 || echo "No APP files found"
          
          # Find DMG file in any location
          DMG_FILE=$(find src-tauri -name "*.dmg" | head -1)
          
          if [ -n "$DMG_FILE" ] && [ -f "$DMG_FILE" ]; then
            echo "✅ Found macOS DMG: $DMG_FILE"
            gh release upload "${{ steps.version.outputs.VERSION }}" "$DMG_FILE" --clobber || {
              echo "⚠️ Failed to upload macOS DMG, continuing..."
            }
          fi

          # Upload updater artifacts (created by createUpdaterArtifacts)
          UPDATER_TGZ=$(find src-tauri -name "*.app.tar.gz" | head -1)
          UPDATER_SIG=$(find src-tauri -name "*.app.tar.gz.sig" | head -1)
          if [ -n "$UPDATER_TGZ" ] && [ -f "$UPDATER_TGZ" ]; then
            echo "✅ Found macOS updater archive: $UPDATER_TGZ"
            gh release upload "${{ steps.version.outputs.VERSION }}" "$UPDATER_TGZ" --clobber || echo "⚠️ Failed to upload updater archive"
          else
            echo "⚠️ No macOS updater archive (.app.tar.gz) found"
          fi
          if [ -n "$UPDATER_SIG" ] && [ -f "$UPDATER_SIG" ]; then
            echo "✅ Found macOS updater signature: $UPDATER_SIG"
            gh release upload "${{ steps.version.outputs.VERSION }}" "$UPDATER_SIG" --clobber || echo "⚠️ Failed to upload updater signature"
          else
            echo "⚠️ No macOS updater signature (.app.tar.gz.sig) found"
          fi

          if [ -z "$DMG_FILE" ]; then
            echo "⚠️ No macOS DMG found"
            
            # Try to find .app and create a simple archive
            APP_FILE=$(find src-tauri -name "*.app" | head -1)
            if [ -n "$APP_FILE" ] && [ -d "$APP_FILE" ]; then
              echo "✅ Found macOS app: $APP_FILE"
              APP_NAME=$(basename "$APP_FILE")
              tar -czf "${APP_NAME%.app}_macos.tar.gz" -C "$(dirname "$APP_FILE")" "$APP_NAME"
              gh release upload "${{ steps.version.outputs.VERSION }}" "${APP_NAME%.app}_macos.tar.gz" --clobber || {
                echo "⚠️ Failed to upload macOS app archive, continuing..."
              }
            else
              echo "⚠️ No macOS artifacts found"
            fi
          fi
          
          echo "✅ macOS artifacts upload attempt completed"

      - name: Build the app (Linux AppImage only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          VITE_OPENSUBTITLES_API_KEY: ${{ secrets.VITE_OPENSUBTITLES_API_KEY }}
          NODE_ENV: production
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "🐧 Building Linux with basic debugging..."
          echo "Debug - Environment info:"
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          echo "Rust: $(rustc --version)"
          echo "Cargo: $(cargo --version)"
          echo "PWD: $(pwd)"
          echo "Available disk space: $(df -h . | tail -1)"
          
          echo "🔧 Trying minimal Linux build..."
          if npm run tauri build -- --bundles appimage,deb --verbose 2>&1 | tee linux-build.log; then
            echo "✅ Linux build successful"
            echo "🔍 Generated files:"
            find src-tauri/target -name "*.AppImage" -o -name "*.deb" | head -10
          else
            echo "❌ Linux build failed, showing logs:"
            tail -100 linux-build.log
            echo "=== Checking for specific error patterns ==="
            grep -i "error\|failed\|panic" linux-build.log | tail -10 || echo "No obvious errors found"
            exit 1
          fi

      - name: Build the app (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        env:
          VITE_OPENSUBTITLES_API_KEY: ${{ secrets.VITE_OPENSUBTITLES_API_KEY }}
          NODE_ENV: production
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "🪟 Building Windows with basic debugging..."
          echo "Debug - Environment info:"
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          echo "Rust: $(rustc --version)"
          echo "Cargo: $(cargo --version)"
          echo "Working directory: $(pwd)"
          echo "Available disk space: $(df -h . | tail -1)"
          
          echo "🔧 Trying minimal Windows build..."
          if npm run tauri build -- --bundles nsis --verbose 2>&1 | tee windows-build.log; then
            echo "✅ Windows build successful"
            echo "🔍 Generated files:"
            find src-tauri/target -name "*.exe" -o -name "*.json" | head -10
          else
            echo "❌ Windows build failed, showing logs:"
            tail -100 windows-build.log
            echo "=== Checking for specific error patterns ==="
            grep -i "error\|failed\|panic" windows-build.log | tail -10 || echo "No obvious errors found"
            exit 1
          fi

      - name: Upload Linux artifacts to release
        if: matrix.target == 'x86_64-unknown-linux-gnu' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📦 Uploading Linux AppImage to release..."
          echo "🔍 Debug: Comprehensive directory search..."
          find src-tauri -type f -name "*" | grep -E "\.(AppImage|deb)$" || echo "No AppImage/deb files found"
          
          echo "📁 All files in target directory:"
          find src-tauri/target -type f | head -20 || echo "Target directory empty"
          
          APPIMAGE_FILE=$(find src-tauri -name "*.AppImage" | head -1)
          DEB_FILE=$(find src-tauri -name "*.deb" | head -1)
          
          # Upload AppImage if found
          if [ -n "$APPIMAGE_FILE" ] && [ -f "$APPIMAGE_FILE" ]; then
            echo "✅ Found AppImage: $APPIMAGE_FILE"
            gh release upload "${{ steps.version.outputs.VERSION }}" "$APPIMAGE_FILE" --clobber
          else
            echo "⚠️ No AppImage found"
          fi

          # Upload updater signature (created by createUpdaterArtifacts)
          APPIMAGE_SIG=$(find src-tauri -name "*.AppImage.sig" | head -1)
          if [ -n "$APPIMAGE_SIG" ] && [ -f "$APPIMAGE_SIG" ]; then
            echo "✅ Found AppImage signature: $APPIMAGE_SIG"
            gh release upload "${{ steps.version.outputs.VERSION }}" "$APPIMAGE_SIG" --clobber || echo "⚠️ Failed to upload AppImage signature"
          else
            echo "⚠️ No AppImage signature found"
          fi
          
          # Upload DEB if found
          if [ -n "$DEB_FILE" ] && [ -f "$DEB_FILE" ]; then
            echo "✅ Found DEB: $DEB_FILE"  
            gh release upload "${{ steps.version.outputs.VERSION }}" "$DEB_FILE" --clobber
          else
            echo "⚠️ No DEB file found"
          fi
          
          # Check if we got at least one package
          if [ -z "$APPIMAGE_FILE" ] && [ -z "$DEB_FILE" ]; then
            echo "❌ No Linux packages found - this should not happen"
            exit 1
          fi

      - name: Upload Windows artifacts to release
        if: matrix.target == 'x86_64-pc-windows-msvc' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📦 Uploading Windows artifacts to release..."
          
          # Debug: Comprehensive file search
          echo "🔍 Debug: All Windows executable files:"
          find src-tauri -type f -name "*.exe" | head -10 || echo "No .exe files found"
          echo "🔍 Debug: All JSON files in bundle directories:"
          find src-tauri -type f -name "*.json" | grep bundle || echo "No bundle JSON files found"
          
          # Find NSIS installer - be more flexible
          NSIS_FILE=""
          for pattern in "*setup.exe" "*.exe"; do
            NSIS_FILE=$(find src-tauri -name "$pattern" | grep -i setup | head -1)
            [ -n "$NSIS_FILE" ] && break
          done
          
          # If still no installer, try any exe in bundle directory
          if [ -z "$NSIS_FILE" ]; then
            NSIS_FILE=$(find src-tauri -name "*.exe" | grep bundle | head -1)
          fi
          
          if [ -n "$NSIS_FILE" ] && [ -f "$NSIS_FILE" ]; then
            echo "✅ Found Windows installer: $NSIS_FILE"
            gh release upload "${{ steps.version.outputs.VERSION }}" "$NSIS_FILE" --clobber || {
              echo "⚠️ Failed to upload Windows installer, continuing..."
            }
          else
            echo "⚠️ No Windows installer found"
          fi

          # Upload updater signature (created by createUpdaterArtifacts)
          NSIS_SIG=$(find src-tauri -name "*setup.exe.sig" | head -1)
          if [ -n "$NSIS_SIG" ] && [ -f "$NSIS_SIG" ]; then
            echo "✅ Found installer signature: $NSIS_SIG"
            gh release upload "${{ steps.version.outputs.VERSION }}" "$NSIS_SIG" --clobber || echo "⚠️ Failed to upload installer signature"
          else
            echo "⚠️ No installer signature found"
          fi
          
          # Skip updater manifest generation here - will be done in separate job
          echo "📦 Skipping updater manifest generation - will be handled by generate-updater-manifest job"
          
          echo "✅ Windows artifacts upload attempt completed"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-app-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            src-tauri/target/*/release/bundle/
            !src-tauri/target/*/release/bundle/**/.*
          retention-days: 30

  generate-updater-manifest:
    needs: build-tauri
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Wait for release assets to be available
        run: |
          echo "⏳ Waiting 30 seconds for all release assets to be fully available..."
          sleep 30

      - name: Get version for manifest  
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v$(node -p "require('./package.json').version")"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Manifest version: $VERSION"

      - name: Generate and upload Tauri updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📦 Generating Tauri updater manifest for ${{ steps.version.outputs.VERSION }}..."
          
          # Read version from the tag (remove 'v' prefix if present)
          VERSION="${{ steps.version.outputs.VERSION }}"
          VERSION_NUM="${VERSION#v}"
          
          echo "Version: $VERSION_NUM"
          
          # Check which macOS file format was actually uploaded
          echo "🔍 Checking available release assets for macOS file format..."
          ASSETS=$(gh release view "$VERSION" --json assets --jq '.assets[].name')
          echo "Available assets:"
          echo "$ASSETS"
          
          # Determine macOS updater URL — prefer .app.tar.gz (required by Tauri updater), fall back to DMG
          MACOS_TGZ=$(echo "$ASSETS" | grep '\.app\.tar\.gz$' | head -1)
          if [ -n "$MACOS_TGZ" ]; then
            MACOS_URL="https://github.com/opensubtitles/opensubtitles-uploader-pro/releases/download/$VERSION/$MACOS_TGZ"
            echo "✅ Found updater archive, using: $MACOS_URL"
          elif echo "$ASSETS" | grep -q "universal\.dmg"; then
            MACOS_URL="https://github.com/opensubtitles/opensubtitles-uploader-pro/releases/download/$VERSION/OpenSubtitles.Uploader.PRO_${VERSION_NUM}_universal.dmg"
            echo "⚠️ No .app.tar.gz — falling back to DMG (updater cannot install DMG): $MACOS_URL"
          else
            echo "❌ No macOS file found"
            MACOS_URL="https://github.com/opensubtitles/opensubtitles-uploader-pro/releases/download/$VERSION/OpenSubtitles.Uploader.PRO_${VERSION_NUM}_universal.dmg"
            echo "⚠️ Falling back to DMG URL: $MACOS_URL"
          fi

          # Fetch updater signatures (.sig assets uploaded by build jobs)
          get_sig() {
            local sig_name
            sig_name=$(echo "$ASSETS" | grep -E "$1" | head -1)
            if [ -n "$sig_name" ]; then
              rm -f "/tmp/$sig_name"
              gh release download "$VERSION" --pattern "$sig_name" --dir /tmp 2>/dev/null && tr -d '\n' < "/tmp/$sig_name" || echo ""
            fi
          }
          WIN_SIG=$(get_sig 'setup\.exe\.sig$')
          MAC_SIG=$(get_sig '\.app\.tar\.gz\.sig$')
          LINUX_SIG=$(get_sig '\.AppImage\.sig$')
          echo "Signatures found — win: ${#WIN_SIG} chars, mac: ${#MAC_SIG} chars, linux: ${#LINUX_SIG} chars"

          # Fail loudly rather than publishing a manifest that silently disables
          # auto-update. An empty signature makes the updater reject the release,
          # and a macOS URL pointing at a .dmg cannot be installed by the updater
          # even when the signature is valid. Both conditions shipped unnoticed
          # through v1.8.23 because this job only warned.
          MANIFEST_ERRORS=0
          for entry in "windows:$WIN_SIG" "macos:$MAC_SIG" "linux:$LINUX_SIG"; do
            if [ -z "${entry#*:}" ]; then
              echo "::error::Empty updater signature for ${entry%%:*} — auto-update would be broken for that platform"
              MANIFEST_ERRORS=$((MANIFEST_ERRORS + 1))
            fi
          done
          case "$MACOS_URL" in
            *.app.tar.gz) ;;
            *) echo "::error::macOS updater URL is not a .app.tar.gz ($MACOS_URL) — the updater cannot install this artifact"
               MANIFEST_ERRORS=$((MANIFEST_ERRORS + 1)) ;;
          esac
          if [ "$MANIFEST_ERRORS" -gt 0 ]; then
            echo "❌ Refusing to publish a broken updater manifest ($MANIFEST_ERRORS problem(s))"
            exit 1
          fi
          echo "✅ Manifest preflight passed: all platforms signed, macOS points at an installable artifact"
          
          # Fetch actual release notes from GitHub
          echo "📝 Fetching release notes for $VERSION..."
          RELEASE_NOTES=$(gh release view "$VERSION" --json body | jq -r '.body // "OpenSubtitles Uploader PRO '"$VERSION"' - New release with improvements and bug fixes"')
          
          # Escape quotes and newlines for JSON (Linux compatible)
          RELEASE_NOTES_ESCAPED=$(echo "$RELEASE_NOTES" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          
          # Create updater manifest with proper Tauri v2 format and actual release notes
          cat > latest.json << EOF
          {
            "version": "$VERSION",
            "notes": "$RELEASE_NOTES_ESCAPED",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$WIN_SIG",
                "url": "https://github.com/opensubtitles/opensubtitles-uploader-pro/releases/download/$VERSION/OpenSubtitles.Uploader.PRO_${VERSION_NUM}_x64-setup.exe"
              },
              "darwin-universal": {
                "signature": "$MAC_SIG",
                "url": "$MACOS_URL"
              },
              "darwin-x86_64": {
                "signature": "$MAC_SIG",
                "url": "$MACOS_URL"
              },
              "darwin-aarch64": {
                "signature": "$MAC_SIG",
                "url": "$MACOS_URL"
              },
              "linux-x86_64": {
                "signature": "$LINUX_SIG",
                "url": "https://github.com/opensubtitles/opensubtitles-uploader-pro/releases/download/$VERSION/OpenSubtitles.Uploader.PRO_${VERSION_NUM}_amd64.AppImage"
              }
            }
          }
          EOF
          
          echo "📋 Generated manifest:"
          cat latest.json | jq '.' || cat latest.json
          
          echo "📤 Uploading updater manifest to release..."
          gh release upload "$VERSION" latest.json --clobber
          
          echo "✅ Updater manifest uploaded successfully"

