name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

  build-desktop-quick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      # bundle.createUpdaterArtifacts is true, so the bundler refuses to finish
      # without a signing key — it built every bundle and then failed on
      # "A public key has been found, but no private key". This job publishes
      # nothing, so a throwaway key is enough; the real secret stays in the
      # release workflow. TAURI_SIGNING_PRIVATE_KEY is read as a file path when
      # the value points at an existing file (tauri-cli bundle.rs).
      - name: Generate throwaway signing key
        run: npx tauri signer generate -w "$RUNNER_TEMP/ci.key" -p "" --force

      - name: Build Tauri app (Linux)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/ci.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm run tauri:build

      - name: Check build artifacts
        run: |
          echo "Build completed successfully!"
          ls -la src-tauri/target/release/bundle/